name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 构建并打包 IPA
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: AIReverse.ipa
          path: build/AIReverse.ipa
          if-no-files-found: error
